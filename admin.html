<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b3fa6">
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" href="icon-admin-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-admin-180.png">

<title>Vichare Dental Admin</title>
<link rel="stylesheet" href="app.css">
<style>
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.kpi b{font-size:1.5rem;font-family:var(--f-display);font-weight:400;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi small{color:var(--muted);font-size:.8rem}
.kpi.alert b{color:var(--bad)}
.kpi.hi{background:linear-gradient(135deg,var(--pink-soft),var(--accent-soft));border-color:transparent}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk);padding:8px 12px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl a{color:var(--ink);font-weight:600}
.tbl button{min-height:32px;padding:4px 10px;font-size:.78rem}
.tbl tfoot td{font-weight:700;background:var(--sunk)}
.rangebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.rangebar input[type=date]{width:auto}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--pink))}
.bar b{font-variant-numeric:tabular-nums}
.olist{display:grid}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.orow:first-child{border-top:0}
.orow a{color:var(--ink);font-weight:600}
.orow .t{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.staffrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.staffrow:first-child{border-top:0}
.sacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sacts button{min-height:34px;padding:5px 10px;font-size:.8rem}
.toolbar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar2 .chips{flex:1 1 auto;min-width:0}
.sumline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sumline span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.84rem;color:var(--muted)}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}
.stack{display:grid;gap:16px}
.login-card .switch{font-size:.88rem}
#anav{flex-wrap:nowrap;overflow-x:auto}
@media (max-width:520px){#anav button{flex:1 0 auto;padding-inline:10px}}
</style>
</head><body>

  <div class="login-card">
    <img id="login-logo" alt="" width="64" height="63">

      <label class="f">Email<input id="login-email" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="f">Password<input id="login-pw" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary" id="login-go">Sign in</button>

    </form>

      <p class="hint" style="margin:0">Do this once. The person who sets up the clinic becomes the owner and can add staff.</p>
      <label class="f">Your name<input id="su-name" autocomplete="name" placeholder="Dr. "></label>
      <label class="f">Email<input id="su-email" type="email" autocomplete="username" inputmode="email"></label>
      <label class="f">Password<input id="su-pw" type="password" autocomplete="new-password" placeholder="At least 8 characters"></label>
      <label class="f">Confirm password<input id="su-pw2" type="password" autocomplete="new-password"></label>

      <button type="button" class="linkbtn switch" id="to-signin">Already set up? Sign in</button>

<script>
(() => {
const $ = s => document.querySelector(s), esc = VDC.esc, R = VDC.rupees, today = () => VDC.todayISO();
let me = null, view = "overview", patients = [], staff = [], todayAppts = [], monthPays = [], monthLoaded = false, rangePays = [], rangeLoaded = false, owner = null;
let unsubs = [], rangeUnsub = null, range = { preset:"month", from:"", to:"" }, duesFilter = "all";
const greet = () => { const h = new Date().getHours(); return h<12 ? "Good morning" : h<17 ? "Good afternoon" : "Good evening"; };
const APPT_CLASS = { Scheduled:"tag", Arrived:"warn", Done:"ok", Missed:"alert", Cancelled:"tag" };
const link = (id, name) => `<a href="index.html#patient-${encodeURIComponent(id)}">${esc(name)}</a>`;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2800); }
function showBanner(msg){ const b = $("#banner"); b.textContent = msg; b.hidden = false; }
function saveFile(name, data, mime){
  const url = URL.createObjectURL(new Blob([data], { type:mime })), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const csv = rows => rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(",")).join("\n");
VDC.onError = e => { const c = (e && e.code) || ""; toast(c.includes("permission-denied") ? "Your account can't do that." : "Could not sync: " + ((e && e.message) || c)); };

/* ---------- start and sign-in ---------- */
async function init(){
  $("#login-logo").src = $("#logo").src;
  let mode;
  try{ mode = await VDC.start(); }catch(e){ showBanner("The app could not start: " + (e.message||e)); return; }
  if(mode === "cloud"){
    VDC.onAuth(user => { if(!settingUp) handleUser(user); });
  } else {
    me = VDC.me = { name:"", role:"admin", local:true };
    showBanner("Showing records saved on this device. Staff sign-in and records shared between devices need Firebase (see FIREBASE-SETUP.md).");
    attach();
  }
}
let settingUp = false;
async function handleUser(user){
      detach();
      if(!user){ me = VDC.me = null; showLogin("signin"); return; }
      showLogin("checking", user);
      const prof = await VDC.profile(user);
      if(prof.error){ showLogin("error", user, VDC.authMessage(prof.error)); return; }
      if(prof.none || !prof.active){ showLogin("denied", user, "This account is not set up for the clinic, or it has been switched off."); return; }
      if(prof.role !== "admin"){ showLogin("denied", user, "This app is only for clinic admins. Your account can use the clinic app."); return; }
      me = VDC.me = prof; hideLogin(); attach();
}
function showLogin(state, user, msg){
  const box = $("#login"); box.hidden = false; document.body.classList.add("locked");
  const lf = $("#login-form"), sf = $("#setup-form"), info = $("#login-info"); $("#login-err").hidden = true;
  if(state==="signin" || state==="setup"){ info.hidden = true; lf.hidden = state!=="signin"; sf.hidden = state!=="setup"; return; }
  lf.hidden = true; sf.hidden = true; info.hidden = false;
  info.innerHTML = state==="checking" ? `<p>Checking your access…</p>`
    : `<p>${esc(msg)}</p>${user ? `<p class="hint">Signed in as ${esc(user.email)}</p>` : ""}<div class="actions" style="justify-content:center"><a class="btn" href="index.html">Open clinic app</a>${state==="error" ? `<button type="button" class="primary" id="li-retry">Try again</button>` : ""}<button type="button" id="li-out">Sign out</button></div>`;
  const o = $("#li-out"); if(o) o.onclick = () => VDC.signOut();
  const r = $("#li-retry"); if(r) r.onclick = () => location.reload();
}
function hideLogin(){ $("#login").hidden = true; document.body.classList.remove("locked"); }
function setupLoginForms(){
  const err = m => { const e = $("#login-err"); e.textContent = m; e.hidden = false; };
  $("#to-setup").onclick = () => showLogin("setup");
  $("#to-signin").onclick = () => showLogin("signin");
  $("#login-form").onsubmit = async e => { e.preventDefault(); $("#login-err").hidden = true; const b = $("#login-go"); b.disabled = true; b.textContent = "Signing in…";
    try{ await VDC.signIn($("#login-email").value, $("#login-pw").value); $("#login-pw").value = ""; }catch(x){ err(VDC.authMessage(x)); }
    finally{ b.disabled = false; b.textContent = "Sign in"; } };
  $("#login-forgot").onclick = async () => { const em = $("#login-email").value.trim(); if(!em){ err("Type your email address first, then tap Forgot password."); return; }
    try{ await VDC.resetPassword(em); err("A password reset link has been sent to " + em + "."); }catch(x){ err(VDC.authMessage(x)); } };
  $("#setup-form").onsubmit = async e => { e.preventDefault(); $("#login-err").hidden = true;
    const name = $("#su-name").value.trim(), em = $("#su-email").value.trim(), pw = $("#su-pw").value, pw2 = $("#su-pw2").value;
    if(!name || !em || !pw){ err("Fill in your name, email and password."); return; }
    if(pw.length < 8){ err("Use a password of at least 8 characters."); return; }
    if(pw !== pw2){ err("The two passwords don't match."); return; }
    const b = $("#su-go"); b.disabled = true; b.textContent = "Setting up…";
    settingUp = true;
    try{ await VDC.setupOwner(name, em, pw); settingUp = false; await handleUser(VDC.auth.currentUser); toast("Clinic set up. You are the owner."); }
    catch(x){ settingUp = false; if(VDC.auth.currentUser) await VDC.signOut(); showLogin("setup"); err(x.code==="owner-exists" ? x.message : VDC.authMessage(x)); }
    finally{ settingUp = false; b.disabled = false; b.textContent = "Set up clinic"; } };
}

/* ---------- data ---------- */
function attach(){
  const ub = $("#userbar");
  if(me.local) ub.hidden = true; else { ub.hidden = false; $("#ub-name").textContent = `${me.name || me.email} · Admin`; $("#ub-out").onclick = () => VDC.signOut(); }
  const t = today(), m0 = t.slice(0,8) + "01";
  unsubs.push(VDC.store.watch("patients", null, rows => { patients = rows; render(); }));
  unsubs.push(VDC.store.watch("appointments", ["date","==",t], rows => { todayAppts = rows; if(view==="overview") render(); }));
  unsubs.push(VDC.store.watch("payments", [["date",">=",m0],["date","<=",t]], rows => { monthPays = rows; monthLoaded = true; if(view==="overview") render(); }));
  if(VDC.cloud){
    unsubs.push(VDC.store.watch("staff", null, rows => { staff = rows; if(view==="staff") render(); }));
    VDC.store.get("meta","owner").then(o => { owner = o; if(view==="staff") render(); }).catch(() => {});
  }
  watchRange(); render();
}
function detach(){ unsubs.forEach(u => { try{ u(); }catch{} }); unsubs = []; if(rangeUnsub){ rangeUnsub(); rangeUnsub = null; } patients = []; staff = []; todayAppts = []; monthPays = []; rangePays = []; monthLoaded = rangeLoaded = false; }
function rangeDates(){
  const t = today(), first = t.slice(0,8) + "01", d = new Date(t + "T00:00");
  if(range.preset==="today") return [t, t];
  if(range.preset==="week") return [VDC.addDays(t, -((d.getDay()+6)%7)), t];
  if(range.preset==="month") return [first, t];
  if(range.preset==="lastmonth") return [VDC.addMonths(first, -1), VDC.addDays(first, -1)];
  return [range.from || first, range.to || t];
}
function watchRange(){
  if(rangeUnsub) rangeUnsub();
  const [from, to] = rangeDates(); rangeLoaded = false;
  rangeUnsub = VDC.store.watch("payments", [["date",">=",from],["date","<=",to]], rows => { rangePays = rows; rangeLoaded = true; if(view==="collections") render(); });
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll("#anav [data-v]").forEach(b => b.setAttribute("aria-current", b.dataset.v===view ? "page" : "false"));
  if(!me) return;
  ({ overview:renderOverview, collections:renderCollections, dues:renderDues, staff:renderStaff })[view]();
}
document.querySelectorAll("#anav [data-v]").forEach(b => b.onclick = () => { view = b.dataset.v; render(); window.scrollTo({ top:0 }); });

function billsAll(){ return patients.map(p => ({ p, b:VDC.billing(p) })); }
function renderOverview(){
  const t = today(), bills = billsAll();
  const todaySum = monthPays.filter(x=>x.date===t).reduce((s,x)=>s+(Number(x.amount)||0),0), todayN = monthPays.filter(x=>x.date===t).length;
  const monthSum = monthPays.reduce((s,x)=>s+(Number(x.amount)||0),0);
  const owing = bills.filter(x=>x.b.balance>0), outstanding = owing.reduce((s,x)=>s+x.b.balance,0);
  const late = bills.filter(x=>x.b.overdue>0), overdue = late.reduce((s,x)=>s+x.b.overdue,0);
  const week = VDC.addDays(t, 7), soon = [];
  bills.forEach(({p,b}) => b.plan.forEach((r,i) => { if(r.left>0 && r.due>=t && r.due<=week) soon.push({ p, r, n:i+1 }); }));
  soon.sort((x,y) => x.r.due.localeCompare(y.r.due));
  const appts = todayAppts.slice().sort((x,y)=>(x.time||"").localeCompare(y.time||"")), act = appts.filter(a=>a.status!=="Cancelled");
  const cnt = st => appts.filter(a=>a.status===st).length;
  const modes = {}; monthPays.forEach(x => { modes[x.mode] = (modes[x.mode]||0) + (Number(x.amount)||0); });
  const maxMode = Math.max(1, ...Object.values(modes));
  const mLabel = new Date(t+"T00:00").toLocaleDateString("en-IN",{ month:"long" });
  $("#view").innerHTML = `
    <section class="hero" aria-label="Clinic today">
      <div class="hero-txt">
        <p class="eyebrow">${greet()}${me.name ? ", " + esc(me.name.split(" ")[0]) : ""}</p>
        <h2>Clinic at a glance</h2>
        <div class="hstats"><span><b>${patients.length}</b> patients</span><span><b>${act.length}</b> appointments today</span><span><b>${cnt("Done")}</b> done</span></div>
      </div>
      <svg class="hero-art" viewBox="0 0 160 120" aria-hidden="true"><use href="#art-hero"/></svg>
    </section>
    <div class="kpis">
      <div class="kpi hi"><span>Collected today</span><b>${monthLoaded ? R(todaySum) : "…"}</b><small>${todayN} payment${todayN===1?"":"s"}</small></div>
      <div class="kpi"><span>This month</span><b>${monthLoaded ? R(monthSum) : "…"}</b><small>${esc(mLabel)} so far</small></div>
      <div class="kpi"><span>Outstanding</span><b>${R(outstanding)}</b><small>${owing.length===1 ? "1 patient owes" : owing.length + " patients owe"}</small></div>
      <div class="kpi alert"><span>Overdue</span><b>${R(overdue)}</b><small>${late.length} patient${late.length===1?"":"s"} late</small></div>
    </div>
    <div class="cols">
      <div class="card"><div class="cardhead"><h3>Today's OPD</h3><a class="btn" href="index.html">Open clinic app</a></div>
        <div class="achips" style="margin-bottom:10px"><span class="pill tag">${cnt("Scheduled")} scheduled</span><span class="pill warn">${cnt("Arrived")} waiting</span><span class="pill ok">${cnt("Done")} done</span><span class="pill alert">${cnt("Missed")} missed</span></div>
        ${appts.length ? `<div class="olist">${appts.map(a=>`<div class="orow"><span class="t">${esc(VDC.fmtTime(a.time))}</span><div>${link(a.patientId, a.patientName)}<div class="sub">${esc(a.treatment||"Appointment")}</div></div><span class="pill ${APPT_CLASS[a.status]||"tag"}">${esc(a.status)}</span></div>`).join("")}</div>` : `<p class="hint">No appointments booked for today.</p>`}
      </div>
      <div class="card"><h3>Instalments due in the next 7 days</h3>
        ${soon.length ? `<div class="olist">${soon.map(({p,r,n})=>`<div class="orow"><span class="t">${esc(VDC.fmtDate(r.due))}</span><div>${link(p._id, p.name)}<div class="sub">Instalment ${n}${p.phone ? " · " + esc(p.phone) : ""}</div></div><b>${R(r.left)}</b></div>`).join("")}</div>` : `<p class="hint">Nothing due this week.</p>`}
      </div>
    </div>
    <div class="card" style="margin-top:16px"><h3>${esc(mLabel)} collections by payment mode</h3>
      ${Object.keys(modes).length ? `<div class="bars">${Object.entries(modes).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<div class="bar"><span>${esc(m)}</span><span class="track"><i style="width:${Math.max(3, Math.round(v/maxMode*100))}%"></i></span><b>${R(v)}</b></div>`).join("")}</div>` : `<p class="hint">No payments recorded this month yet.</p>`}
    </div>`;
}

function renderCollections(){
  const [from, to] = rangeDates();
  const list = rangePays.slice().sort((x,y) => (y.date + (y.createdAt||"")).localeCompare(x.date + (x.createdAt||"")));
  const total = list.reduce((s,x)=>s+(Number(x.amount)||0),0);
  const modes = {}; list.forEach(x => { modes[x.mode] = (modes[x.mode]||0) + (Number(x.amount)||0); });
  const presets = [["today","Today"],["week","This week"],["month","This month"],["lastmonth","Last month"],["custom","Custom"]];
  $("#view").innerHTML = `
    <div class="rangebar">
      <div class="chips" role="group" aria-label="Period">${presets.map(([k,l])=>`<button type="button" class="chip" data-p="${k}" aria-pressed="${range.preset===k}">${l}</button>`).join("")}</div>
      ${range.preset==="custom" ? `<label class="f inline">From<input type="date" id="r-from" value="${from}"></label><label class="f inline">To<input type="date" id="r-to" value="${to}"></label><button type="button" id="r-apply" class="primary">Show</button>` : ""}
    </div>
    <div class="sumline"><span><b>${R(total)}</b> collected</span><span><b>${list.length}</b> payment${list.length===1?"":"s"}</span><span>${esc(VDC.fmtDate(from))} – ${esc(VDC.fmtDate(to))}</span>${Object.entries(modes).map(([m,v])=>`<span>${esc(m)} <b>${R(v)}</b></span>`).join("")}</div>
    <div class="toolbar2"><span></span><button type="button" id="c-csv" ${list.length ? "" : "disabled"}>Export .csv</button></div>
    ${!rangeLoaded ? `<div class="empty">Loading payments…</div>` : list.length ? `<div class="tblwrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Receipt</th><th>Patient</th><th class="num">Amount</th><th>Mode</th><th>Received by</th><th></th></tr></thead>
      <tbody>${list.map(x=>`<tr><td>${esc(VDC.fmtDate(x.date))}</td><td>${esc(x.receiptNo||"")}</td><td>${link(x.patientId, x.patientName)}<div class="sub">${esc(x.pid||"")}</div></td><td class="num"><b>${R(x.amount)}</b></td><td>${esc(x.mode)}${x.ref ? `<div class="sub">${esc(x.ref)}</div>` : ""}</td><td>${esc(x.receivedBy||"—")}</td><td style="white-space:nowrap"><button type="button" data-rc="${esc(x._id)}">Receipt</button> <button type="button" class="ghost danger" data-del="${esc(x._id)}">Delete</button></td></tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="3">Total</td><td class="num">${R(total)}</td><td colspan="3"></td></tr></tfoot></table></div>`
      : `<div class="empty"><h3>No payments in this period</h3><p>Payments recorded in the clinic app appear here.</p></div>`}`;
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { range.preset = b.dataset.p; if(b.dataset.p!=="custom") watchRange(); render(); });
  const ap = $("#r-apply"); if(ap) ap.onclick = () => { range.from = $("#r-from").value; range.to = $("#r-to").value; if(range.from > range.to){ toast("The start date must be before the end date."); return; } watchRange(); render(); };
  $("#c-csv").onclick = () => saveFile(`vichare-collections-${from}-to-${to}.csv`, csv([["Date","Receipt","Patient","Patient ID","Phone","Amount","Mode","Reference","Note","Received by"], ...list.map(x=>[x.date,x.receiptNo,x.patientName,x.pid,x.phone,x.amount,x.mode,x.ref,x.note,x.receivedBy])]), "text/csv");
  document.querySelectorAll("[data-rc]").forEach(b => b.onclick = () => { const x = list.find(y=>y._id===b.dataset.rc); if(!x) return; const p = patients.find(y=>y._id===x.patientId); saveFile(`receipt-${x.receiptNo||x._id}.html`, VDC.receiptHTML(x, p, $("#logo").src), "text/html"); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if(!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Tap again"; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = "Delete"; } }, 3500); return; }
    const x = list.find(y=>y._id===b.dataset.del); if(!x) return;
    try{ await VDC.deletePayment(x); toast(`Payment of ${R(x.amount)} deleted`); }catch(e){ toast("Could not delete: " + VDC.authMessage(e)); }
  });
}

function renderDues(){
  const t = today(), week = VDC.addDays(t, 7);
  const all = billsAll().filter(x => x.b.balance > 0);
  const sets = { all, overdue: all.filter(x=>x.b.overdue>0), week: all.filter(x=>x.b.next && x.b.next.due<=week) };
  const list = sets[duesFilter].slice().sort((x,y) => (y.b.overdue - x.b.overdue) || ((x.b.next ? x.b.next.due : "9") .localeCompare(y.b.next ? y.b.next.due : "9")) || (y.b.balance - x.b.balance));
  const total = list.reduce((s,x)=>s+x.b.balance,0);
  $("#view").innerHTML = `
    <div class="toolbar2">
      <div class="chips" role="group" aria-label="Show">${[["all","All with balance"],["overdue","Overdue"],["week","Due within 7 days"]].map(([k,l])=>`<button type="button" class="chip" data-f="${k}" aria-pressed="${duesFilter===k}">${l} <span class="cnt">${sets[k].length}</span></button>`).join("")}</div>
      <button type="button" id="d-csv" ${list.length ? "" : "disabled"}>Export .csv</button>
    </div>
    <div class="sumline"><span><b>${R(total)}</b> to collect</span><span><b>${list.length}</b> patient${list.length===1?"":"s"}</span></div>
    ${list.length ? `<div class="tblwrap"><table class="tbl">
      <thead><tr><th>Patient</th><th>Phone</th><th class="num">Payable</th><th class="num">Paid</th><th class="num">Balance</th><th>Next instalment</th></tr></thead>
      <tbody>${list.map(({p,b})=>`<tr><td>${link(p._id, p.name)}<div class="sub">${esc(p.pid||"")}</div></td><td>${esc(p.phone||"—")}</td><td class="num">${R(b.payable)}</td><td class="num">${R(b.paid)}</td><td class="num"><b>${R(b.balance)}</b>${b.overdue>0 ? `<div><span class="pill alert">${R(b.overdue)} overdue</span></div>` : ""}</td><td>${b.next ? `${esc(VDC.fmtDate(b.next.due))} · ${R(b.next.left)}` : `<span class="sub">No plan</span>`}</td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="empty"><svg class="empty-art" viewBox="0 0 160 120" aria-hidden="true"><use href="#art-hero"/></svg><h3>Nothing to collect here</h3><p>Patients with a balance appear once fees are added to their treatments.</p></div>`}`;
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { duesFilter = b.dataset.f; render(); });
  $("#d-csv").onclick = () => saveFile(`vichare-dues-${t}.csv`, csv([["Patient","Patient ID","Phone","Payable","Paid","Balance","Overdue","Next due date","Next due amount"], ...list.map(({p,b})=>[p.name,p.pid,p.phone,b.payable,b.paid,b.balance,b.overdue,b.next?b.next.due:"",b.next?b.next.left:""])]), "text/csv");
}

function renderStaff(){
  const v = $("#view");
  if(!VDC.cloud){ v.innerHTML = `<div class="card"><h3>Staff accounts</h3><p>Staff sign-in needs the shared clinic database. Follow <b>FIREBASE-SETUP.md</b> to connect Firebase, then add staff here.</p></div>`; return; }
  const ownerId = owner && owner.uid;
  const list = staff.slice().sort((a,b) => (b.active===true) - (a.active===true) || (a.role===b.role ? 0 : a.role==="admin" ? -1 : 1) || String(a.name).localeCompare(String(b.name)));
  v.innerHTML = `<div class="stack">
    <div class="card"><div class="cardhead"><h3>Staff accounts</h3><span class="sub">${list.filter(s=>s.active).length} active</span></div>
      <div>${list.map(s => { const isOwner = s._id===ownerId, isMe = s._id===me.uid; return `<div class="staffrow">
        <div><b>${esc(s.name||"—")}</b>${isOwner ? ` <span class="pill ok">Owner</span>` : ""}${isMe ? ` <span class="pill tag">You</span>` : ""}
          <div class="sub">${esc(s.email||"")}</div>
          <div class="achips" style="margin-top:4px"><span class="pill ${s.role==="admin" ? "warn" : "tag"}">${s.role==="admin" ? "Admin" : "Staff"}</span>${s.active ? `<span class="pill ok">Active</span>` : `<span class="pill alert">Switched off</span>`}</div></div>
        <div class="sacts">
          ${isOwner ? "" : `<button type="button" data-role="${esc(s._id)}">${s.role==="admin" ? "Make staff" : "Make admin"}</button>`}
          ${isOwner || isMe ? "" : `<button type="button" class="${s.active ? "ghost danger" : ""}" data-act="${esc(s._id)}">${s.active ? "Switch off" : "Switch on"}</button>`}
          <button type="button" data-reset="${esc(s.email||"")}">Send password reset</button>
        </div></div>`; }).join("")}</div>
    </div>
    <form class="card" id="sf" novalidate><h3>Add a staff member</h3>
      <div class="grid">
        <label class="f">Name <span class="req">*</span><input id="s-name" autocomplete="off"></label>
        <label class="f">Email <span class="req">*</span><input id="s-email" type="email" inputmode="email" autocomplete="off"></label>
        <label class="f">Temporary password <span class="req">*</span><input id="s-pw" type="text" autocomplete="off" placeholder="At least 8 characters"></label>
        <label class="f">Access<select id="s-role"><option value="staff">Staff · clinic app</option><option value="admin">Admin · clinic and admin apps</option></select></label>
      </div>
      <p class="hint">Give them the email and temporary password. They can change it any time with <b>Forgot password</b> on the sign-in screen.</p>
      <p id="s-err" class="hint login-err" hidden></p>
      <div class="actions"><button type="submit" class="primary" id="s-go">Add staff member</button></div>
    </form></div>`;
  v.querySelectorAll("[data-role]").forEach(b => b.onclick = async () => { const s = staff.find(x=>x._id===b.dataset.role); if(!s) return;
    try{ await VDC.store.update("staff", s._id, { role: s.role==="admin" ? "staff" : "admin" }); toast(`${s.name} is now ${s.role==="admin" ? "staff" : "an admin"}`); }catch(e){ toast("Could not change: " + VDC.authMessage(e)); } });
  v.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => { const s = staff.find(x=>x._id===b.dataset.act); if(!s) return;
    try{ await VDC.store.update("staff", s._id, { active: !s.active }); toast(s.active ? `${s.name} can no longer sign in` : `${s.name} can sign in again`); }catch(e){ toast("Could not change: " + VDC.authMessage(e)); } });
  v.querySelectorAll("[data-reset]").forEach(b => b.onclick = async () => { try{ await VDC.resetPassword(b.dataset.reset); toast("Password reset email sent to " + b.dataset.reset); }catch(e){ toast(VDC.authMessage(e)); } });
  $("#sf").onsubmit = async e => { e.preventDefault(); const er = $("#s-err"); er.hidden = true;
    const name = $("#s-name").value.trim(), email = $("#s-email").value.trim(), pw = $("#s-pw").value, role = $("#s-role").value;
    if(!name || !email || !pw){ er.textContent = "Fill in the name, email and temporary password."; er.hidden = false; return; }
    if(pw.length < 8){ er.textContent = "Use a temporary password of at least 8 characters."; er.hidden = false; return; }
    const b = $("#s-go"); b.disabled = true; b.textContent = "Adding…";
    try{ await VDC.addStaff({ name, email, password:pw, role }); toast(`${name} added. Share the email and temporary password with them.`); render(); }
    catch(x){ er.textContent = VDC.authMessage(x); er.hidden = false; b.disabled = false; b.textContent = "Add staff member"; } };
}

setupLoginForms();
init();
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")) navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body></html>
